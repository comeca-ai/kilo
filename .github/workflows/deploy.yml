name: Deploy · Cloudflare

# Deploy automático do Worker (kilo-passaporte) a cada push na main.
# Validado contra developers.cloudflare.com (wrangler v4) em 2026-09-07.
#
# Secrets esperadas (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — template "Edit Cloudflare Workers" + Account → D1 → Edit
#   CLOUDFLARE_ACCOUNT_ID  — id da conta Cloudflare
#   SIGNING_KEY_JWK        — (opcional, recomendado) JWK privada Ed25519 do emissor;
#                            sem ela /api/passaporte responde 503 NO_SIGNING_KEY.
#
# ORDEM IMPORTANTE (docs oficiais): o `wrangler deploy` vem ANTES do `secret put` —
# `secret put` cria uma nova versão do Worker e a deploya imediatamente; num Worker
# inexistente ele falha com erro 10007.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kilo
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"

jobs:
  deploy:
    name: Worker + D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar wrangler
        run: npm install --no-save wrangler@^4

      - name: Testes do motor (gate de deploy)
        run: node --test test/run.test.mjs test/passaporte-v2.test.mjs

      - name: Resolver database_id do D1 (cria se não existir)
        run: |
          set -e
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
            | jq -r '.result[] | select(.name=="kilo-passaporte") | .uuid' | head -1)
          if [ -z "$ID" ]; then
            echo "D1 não encontrado — criando kilo-passaporte..."
            ID=$(curl -s -X POST -H "$AUTH" -H "content-type: application/json" \
              -d '{"name":"kilo-passaporte"}' \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
              | jq -r '.result.uuid')
          fi
          test -n "$ID" || { echo "FALHA: não consegui obter o database_id"; exit 1; }
          sed -i "s/database_id = \".*\"/database_id = \"$ID\"/" wrangler.toml
          echo "database_id resolvido: $ID"

      - name: Aplicar migrations do D1 (remote; em CI a confirmação é pulada)
        run: npx wrangler d1 migrations apply kilo-passaporte --remote

      - name: Deploy do Worker + static assets
        run: npx wrangler deploy

      - name: Gravar SIGNING_KEY_JWK no Worker (cria nova versão e redeploya; se a secret existir)
        env:
          SIGNING_KEY_JWK: ${{ secrets.SIGNING_KEY_JWK }}
        run: |
          if [ -n "$SIGNING_KEY_JWK" ]; then
            printf '%s' "$SIGNING_KEY_JWK" | npx wrangler secret put SIGNING_KEY_JWK
            echo "Secret de assinatura gravada (byte-exato, sem \\n final)."
          else
            echo "SIGNING_KEY_JWK não está nas secrets do repo — pulando (ver cabeçalho deste arquivo)."
          fi

      - name: Smoke pós-deploy (descobre o subdomain workers.dev via API)
        run: |
          set -e
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          echo "subdomain: $SUB"
          sleep 3
          curl -sf "https://kilo-passaporte.${SUB}.workers.dev/api/health" && echo " — health OK"
