name: CI · PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-kilo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Nome idêntico ao job do deploy.yml: a proteção da main exige o check
    # "Worker + D1" — assim PRs também satisfazem a regra antes do merge.
    name: Worker + D1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testes do motor (gate de merge)
        run: node --test test/run.test.mjs test/passaporte-v2.test.mjs test/registro.test.mjs
      - name: Wrangler dry-run (valida wrangler.toml sem deploy)
        run: |
          npm install --no-save wrangler@^4
          npx wrangler deploy --dry-run
