<style>
:root{--ink-page:#080B12;--ink-800:#0B0F19;--ink-850:#0A0E17;--ink-750:#0F1522;--ink-700:#141B29;--line:#1B2436;--line-strong:#26314A;--text-hi:#EEF1F7;--text-body:#B4BFD2;--text-muted:#8A97AE;--text-faint:#7C89A3;--paper:#F5F0E4;--paper-ink:#0B0F19;--paper-muted:#6C6047;--amber:#E8B44A;--amber-hi:#F4CE7C;--green:#62C39B;--green-hi:#7BD3AD;--green-ink:#1E6B4F;--clay:#E8735A;--serif:"Newsreader",Georgia,serif;--sans:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink-page);color:var(--text-hi);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}a{color:var(--amber);text-decoration:none}a:hover{color:var(--amber-hi)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}::selection{background:var(--amber);color:var(--ink-800)}.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh}aside{flex:0 1 264px;min-width:224px;display:flex;flex-direction:column;gap:30px;padding:28px 20px 24px;background:var(--ink-800);border-right:1px solid var(--line)}.lock{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:10px;background:var(--paper);color:var(--ink-800);display:grid;place-items:center;font-family:var(--serif);font-size:21px;box-shadow:0 2px 0 0 var(--amber)}.lock strong,.lock small{display:block;font-family:var(--mono);letter-spacing:.16em}.lock strong{font-size:11px;font-weight:500}.lock small{font-size:10px;color:var(--text-faint)}nav{display:flex;flex-direction:column;gap:2px}nav a{position:relative;display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:10px;color:var(--text-muted)}nav a.on{background:var(--ink-700);color:var(--paper)}nav a .n{font:11px var(--mono);width:12px;color:var(--text-faint)}nav a.on .n{color:var(--amber)}nav a::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px}nav a.on::before{background:var(--amber)}.aside-foot{margin-top:auto;display:flex;flex-direction:column;gap:16px;padding-top:22px;border-top:1px solid var(--line)}.live{display:flex;align-items:center;gap:9px;font:11px var(--mono);color:var(--text-muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:kpulse 2.6s ease-in-out infinite}@keyframes kpulse{0%,100%{opacity:1}50%{opacity:.3}}.lc{display:flex;align-items:baseline;gap:10px;padding:13px 14px;border-radius:11px;background:var(--ink-750);border:1px solid var(--line)}.lc b{font:22px/1 var(--serif);color:var(--amber);font-variant-numeric:tabular-nums;font-weight:400}.lc span{font-size:11px;color:var(--text-muted)}main{flex:1 1 580px;min-width:0;display:flex;flex-direction:column}header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:19px 36px;border-bottom:1px solid #161E2D;background:rgba(10,14,23,.92)}.crumb{font:11px var(--mono);letter-spacing:.16em;color:var(--text-faint)}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:5px 11px;border-radius:100px;border:1px solid var(--line-strong);font:10.5px var(--mono);color:var(--text-muted)}.pill.ok{background:rgba(98,195,155,.1);border-color:rgba(98,195,155,.32);color:var(--green-hi)}.view{flex:1;padding:44px 36px 60px}.col{max-width:1000px;display:flex;flex-direction:column;gap:28px}.kicker{display:flex;align-items:center;gap:14px;font:10.5px var(--mono);letter-spacing:.22em;color:var(--amber)}.kicker i{width:26px;height:1px;background:var(--amber);display:block}h1{margin:0;font:400 clamp(36px,5.4vw,64px)/1 var(--serif);letter-spacing:-.022em;color:var(--paper)}h1 em{color:var(--amber);font-style:italic}h2{margin:0;font:400 28px/1.15 var(--serif);letter-spacing:-.02em;color:var(--paper)}p.lead{margin:0;max-width:58ch;font-size:17px;line-height:1.62;color:var(--text-body)}.row{display:flex;flex-wrap:wrap;gap:11px;align-items:center}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:600;font-size:14px}.btn-pri{background:var(--amber);color:var(--ink-800)}.btn-pri:hover{background:var(--amber-hi)}.btn-sec{background:transparent;border:1px solid var(--line-strong);color:var(--text-body)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:18px 18px 20px;border-radius:18px;background:var(--ink-750);border:1px solid var(--line)}.card .n{font:11px var(--mono);color:var(--amber);letter-spacing:.16em}.card h3{margin:8px 0 6px;font:500 16px var(--sans)}.card p{margin:0;color:var(--text-muted);font-size:14px}label.lbl{display:block;font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin:0 0 6px}input[type=text],input[type=number],textarea{width:100%;background:var(--ink-850);border:1px solid var(--line-strong);border-radius:9px;padding:12px 14px;font:14px var(--mono);color:var(--text-hi)}textarea{min-height:120px;resize:vertical}.grades{display:flex;gap:8px}.grades button{flex:1;border:1px solid var(--line);background:var(--ink-850);border-radius:12px;padding:12px 8px;font:600 13px var(--mono)}.grades button.on{border-color:var(--amber);color:var(--amber);background:rgba(232,180,74,.09)}.out{padding:18px 16px;border:1px solid var(--line);border-radius:18px;background:var(--ink-750)}.num{font:400 clamp(1.5rem,4vw,2.2rem)/1.1 var(--serif);letter-spacing:-.02em;color:var(--amber);font-variant-numeric:tabular-nums}.muted{font:12px/1.6 var(--mono);color:var(--text-muted)}.bar{height:8px;background:#3B4763;border-radius:99px;overflow:hidden;margin:6px 0 12px}.bar>i{display:block;height:100%;border-radius:99px}.steps{display:flex;flex-wrap:wrap;gap:8px}.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--ink-700);color:var(--text-faint);border:0;font-size:13px}.step.on{color:var(--text-hi);box-shadow:inset 0 0 0 1px var(--amber)}.step .chip{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:11px var(--mono);background:rgba(232,180,74,.16);color:var(--amber)}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{padding:12px 14px;border-radius:12px;background:var(--ink-850);border:1px solid var(--line)}.field .k{font:10px var(--mono);letter-spacing:.16em;color:var(--text-faint)}.field .v{margin-top:4px}.docs,.checks{display:flex;flex-direction:column;gap:8px}.doc,.check{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--ink-850);border:1px solid var(--line)}.sev{font:10.5px var(--mono);padding:3px 8px;border-radius:99px}.sev.ok{color:var(--green-hi);background:rgba(98,195,155,.12)}.sev.alta{color:var(--amber);background:rgba(232,180,74,.12)}.paper{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:28px 26px;position:relative;overflow:hidden;background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(11,15,25,.04) 28px)}.paper:after{content:"ATESTO, NÃO HOMOLOGO";position:absolute;inset:auto 18px 14px auto;font:10px var(--mono);letter-spacing:.18em;color:var(--paper-muted)}.seal{width:84px;height:84px;border-radius:50%;border:2px solid var(--green-ink);display:grid;place-items:center;font:11px var(--mono);color:var(--green-ink);text-align:center;box-shadow:0 0 0 4px rgba(30,107,79,.12)}footer.api{display:flex;flex-wrap:wrap;gap:10px 20px;padding:21px 36px;border-top:1px solid #161E2D;font:10.5px var(--mono);color:#6E7C96}@media(max-width:720px){header.top,.view{padding-left:18px;padding-right:18px}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <a class="lock" href="/" style="color:inherit"><span class="mark">P</span><span><strong>PASSAPORTE</strong><small>FISCAL · BR-SP</small></span></a>
    <nav id="nav"></nav>
    <div class="aside-foot">
      <div class="live"><span class="dot"></span><span>Worker online</span></div>
      <div class="muted">Ed25519 · ruleset v2026.09</div>
      <div class="lc"><b id="dias">—</b><span>dias até a<br>transição da LC 214</span></div>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="crumb">KILO / <span id="crumb">SIMULADOR</span></div>
      <div class="pills"><span class="pill">CAT 42 / SP</span><span class="pill">ICMS_ACCUMULATED</span><span class="pill ok">atesto · não homologo</span></div>
    </header>
    <div class="view" id="app"></div>
    <footer class="api"><span>Worker MVP</span><span>/api/desagio</span><span>POST /api/passaporte</span><span>POST /api/verify</span><span style="margin-left:auto">fv = VN·(1−g)/(1+i)^T</span></footer>
  </main>
</div>
<script>
(function(){
  var G={A:0.01,B:0.05,C:0.12};
  var NAV=[["home","·","Visão geral"],["sim","1","Simulador"],["emitir","2","Emitir"],["pass","3","Passaporte"],["verif","4","Verificar"],["cart","5","Carteira"]];
  var CRUMB={home:"VISÃO GERAL",sim:"SIMULADOR",emitir:"EMITIR",pass:"PASSAPORTE",verif:"VERIFICAR",cart:"CARTEIRA"};
  var S={view:"sim",vn:2500000,grade:"A",i:1.5,T:12,emitStep:1,verified:false,bolsa:"nao"};
  var BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
  var PCT=new Intl.NumberFormat("pt-BR",{style:"percent",minimumFractionDigits:1,maximumFractionDigits:1});
  function fv(){return S.vn*(1-G[S.grade])/Math.pow(1+S.i/100,S.T)}
  function pv(){var i=S.i/100;return i===0?S.vn:(S.vn/240)*(1-Math.pow(1+i,-240))/i}
  function go(v,extra){S.view=v;if(extra)Object.assign(S,extra);render()}
  document.getElementById("dias").textContent=String(Math.max(0,Math.ceil((Date.parse("2033-01-01")-Date.now())/86400000)));
  function nav(){
    document.getElementById("nav").innerHTML=NAV.map(function(it){var on=S.view===it[0]?" on":"";return '<a href="#'+it[0]+'" class="'+on+'" data-v="'+it[0]+'"><span class="n">'+it[1]+'</span><span>'+it[2]+'</span></a>'}).join('');
    document.getElementById("crumb").textContent=CRUMB[S.view];
  }
  function home(){return '<div class="col"><div class="kicker"><i></i>CRÉDITO DE ICMS ACUMULADO · MVP</div><h1>Seu crédito não vale menos.<br><em>Ele vale sem prova.</em></h1><p class="lead">O passaporte fiscal transforma um dossiê de ICMS acumulado em um objeto assinado e verificável. Homologação continua da SEFAZ.</p><div class="row"><button class="btn btn-pri" data-go="sim">Simular deságio</button><button class="btn btn-sec" data-go="emitir">Emitir passaporte</button></div><div class="cards"><div class="card"><div class="n">01</div><h3>Prepara e atesta</h3><p>Checks do ruleset da rota. Homologação é da SEFAZ — nunca da plataforma.</p></div><div class="card"><div class="n">02</div><h3>Assina em Ed25519</h3><p>Payload canônico com hash de input, output e evidências.</p></div><div class="card"><div class="n">03</div><h3>Registra na bolsa</h3><p>Mural público anti-dupla-venda. Registro não é transferência fiscal.</p></div></div></div>'}
  function sim(){var fair=fv(),p=pv(),g=G[S.grade];return '<div class="col"><h2>Simulador de deságio</h2><p class="lead">Ajuste valor, rating, taxa e prazo. Heurística, não parecer.</p><div><label class="lbl" for="vn">Valor nominal (R$)</label><input id="vn" type="text" value="'+S.vn.toLocaleString('pt-BR')+'"></div><div><label class="lbl">Rating estimado</label><div class="grades">'+['A','B','C'].map(function(k){return '<button data-g="'+k+'" class="'+(S.grade===k?'on':'')+'">'+k+' · '+Math.round(G[k]*100)+'%</button>'}).join('')+'</div></div><div class="fields"><div><label class="lbl" for="i">Taxa mensal i (%)</label><input id="i" type="number" min="0.5" max="4" step="0.1" value="'+S.i+'"></div><div><label class="lbl" for="T">Prazo T (meses)</label><input id="T" type="number" min="3" max="48" value="'+S.T+'"></div></div><div class="out"><div class="muted">Com dossiê atestado · valor justo hoje</div><div class="num">'+BRL.format(fair)+' · '+PCT.format(1-fair/S.vn)+'</div><div class="muted">Sem homologar até 2033 · PV de 240 parcelas</div><div class="num" style="color:var(--clay)">'+BRL.format(p)+' · perda '+PCT.format(1-p/S.vn)+'</div><p class="muted">Glosa '+BRL.format(S.vn*g)+' · diferença preservável '+BRL.format(Math.max(0,fair-p))+'</p><div class="muted">Nominal</div><div class="bar"><i style="width:100%;background:#3B4763"></i></div><div class="muted">Com passaporte</div><div class="bar"><i style="width:'+(fair/S.vn*100)+'%;background:var(--amber)"></i></div><div class="muted">Sem homologar</div><div class="bar"><i style="width:'+(p/S.vn*100)+'%;background:var(--clay)"></i></div><div class="row" style="margin-top:8px"><button class="btn btn-pri" data-go="emitir">Emitir com estes números</button></div></div></div>'}
  function emitir(){var steps=['Dados do estabelecimento','Documentos exigidos','Checks e rating'];var stepHtml=steps.map(function(l,i){var n=i+1;return '<button class="step'+(S.emitStep===n?' on':'')+'" data-step="'+n+'"><span class="chip">'+(S.emitStep>n?'✓':n)+'</span>'+l+'</button>'}).join('');var body='';if(S.emitStep===1){body='<div class="fields">'+[['Razão social','Metalúrgica Horizonte S.A.'],['CNPJ','12.345.678/0001-90'],['IE (SP)','110.042.490.114'],['Competência','2026-02'],['Valor',BRL.format(S.vn)],['Tipo','ICMS_ACCUMULATED']].map(function(f){return '<div class="field"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>'}).join('')+'</div><div class="row"><button class="btn btn-pri" data-step="2">Continuar para documentos</button></div>'}else if(S.emitStep===2){body='<div class="docs">'+[['EFD ICMS/IPI','competência 2026-08 · C100','3.2 MB'],['NF-e XML (3)','chaves conferidas · layout 4.00','186 KB'],['Livro de apuração','SP-ART84 · assinado','740 KB'],['Demonstrativo de saldo','saldo até 2026-02','112 KB']].map(function(d){return '<div class="doc"><strong style="flex:1 1 180px">'+d[0]+'</strong><span class="muted">'+d[1]+'</span><span class="muted">'+d[2]+'</span></div>'}).join('')+'</div><div class="row"><button class="btn btn-pri" data-step="3">Rodar checks</button></div>'}else{body='<p class="muted">Rating nesta tela é estimativa. O grau definitivo sai do ruleset na assinatura.</p><div class="checks">'+[['DOC-COMPLETE','Todos os documentos exigidos pela rota estão presentes','OK'],['PERIODO-COERENTE','Competência do EFD divergente do período de referência','ALTA'],['VALOR-POSITIVO','Valor do crédito é positivo e informado em centavos','OK'],['IE-PRESENTE','Inscrição estadual do estabelecimento informada','OK']].map(function(c){return '<div class="check"><span class="sev '+(c[2]==='OK'?'ok':'alta')+'">'+c[2]+'</span><strong>'+c[0]+'</strong><span class="muted" style="flex:1 1 220px">'+c[1]+'</span></div>'}).join('')+'</div><div class="row"><button class="btn btn-pri" data-go="pass">Assinar e emitir</button></div>'}return '<div class="col"><h2>Emitir passaporte</h2><div class="steps">'+stepHtml+'</div>'+body+'</div>'}
  function pass(){var g=G[S.grade];var acts=S.bolsa==='nao'?[['Registrar título na bolsa','registrado',1],['Consultar','nao',0]]:S.bolsa==='registrado'?[['Listar na vitrine','venda',1],['Retirar registro','nao',0]]:[['Retirar da vitrine','registrado',0]];var label={nao:'Não registrado',registrado:'Registrado',venda:'À venda'}[S.bolsa];return '<div class="col"><h2>Passaporte emitido</h2><div class="paper"><div class="row" style="justify-content:space-between"><div><div class="muted" style="color:var(--paper-muted)">PSP_4A783B5E29B0 · RATING '+S.grade+'</div><h2 style="color:var(--paper-ink);margin-top:8px">Metalúrgica Horizonte S.A.</h2><p class="muted" style="color:var(--paper-muted)">CAT 42/SP · BR-SP-CAT42 v2026.09 · '+BRL.format(S.vn)+'</p></div><div class="seal">ATESTO<br>NÃO<br>HOMOLOGO</div></div><div class="fields" style="margin-top:22px">'+[['CNPJ','12.345.678/0001-90'],['IE','110.042.490.114'],['Competência','2026-02'],['Glosa esperada',PCT.format(g)],['Claim','DOCUMENTED_FOR_REVIEW'],['Validade','08/10/2026']].map(function(f){return '<div class="field" style="background:#efe8d6;border-color:#ddd2b8"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>'}).join('')+'</div></div><div class="card"><div class="n">BOLSA DE REGISTRO</div><h3>Situação: '+label+'</h3><p>Registro na bolsa ≠ transferência fiscal do crédito.</p><div class="row" style="margin-top:12px">'+acts.map(function(a){return '<button class="btn '+(a[2]?'btn-pri':'btn-sec')+'" data-bolsa="'+a[1]+'">'+a[0]+'</button>'}).join('')+'</div></div></div>'}
  function verif(){if(!S.verified)return '<div class="col"><h2>Verificar passaporte</h2><p class="lead">Cole o JSON assinado ou o passport_id.</p><textarea id="payload" placeholder="{\
